services:
  - type: web
    name: gestion-educative-rdc
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build && cd build && npm ci --omit=dev
    preDeployCommand: cd build && node ace migration:run --force
    startCommand: cd build && node bin/server.js
    healthCheckPath: /home
    envVars:
      - key: NODE_VERSION
        value: 25.9.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
      - key: APP_KEY
        generateValue: true
      - key: SESSION_DRIVER
        value: cookie
      - key: DB_CONNECTION
        value: pg
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-educative-rdc-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: gestion-educative-rdc-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gestion-educative-rdc-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: gestion-educative-rdc-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gestion-educative-rdc-db
          property: password
      - key: DB_DATABASE
        fromDatabase:
          name: gestion-educative-rdc-db
          property: database
      - key: MAIL_MAILER
        value: console
      - key: MAIL_HOST
        value: localhost
      - key: MAIL_PORT
        value: 1025
      - key: MAIL_FROM_ADDRESS
        value: no-reply@gestion-educative-rdc.cd
      - key: MAIL_FROM_NAME
        value: Gestion Educative RDC
      - key: MAIL_SECURE
        value: false
      - key: BREVO_API_URL
        value: https://api.brevo.com/v3
      - key: BREVO_SENDER_EMAIL
        value: no-reply@gestion-educative-rdc.cd
      - key: BREVO_SENDER_NAME
        value: Gestion Educative RDC
      - key: OTP_CODE_LENGTH
        value: 6
      - key: OTP_EXPIRES_IN_MINUTES
        value: 10
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: 60
      - key: OTP_MAX_ATTEMPTS
        value: 5
      - key: OTP_PURPOSE
        value: login

databases:
  - name: gestion-educative-rdc-db
    plan: free
    region: frankfurt
    databaseName: gestion_educative_rdc
    user: gestion_educative_rdc
